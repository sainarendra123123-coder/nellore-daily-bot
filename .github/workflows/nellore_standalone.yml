name: Nellore Daily standalone Instagram

on:
  schedule:
    # India time :16, with retries at :31 and :46.
    - cron: '46 * * * *'
    - cron: '1 * * * *'
    - cron: '16 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nellore-standalone-instagram
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install reel dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install -r requirements.txt
      - name: Generate and publish Telugu reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          HOURLY_INSTAGRAM: 'true'
        run: python main.py
      - name: Save rendered reel
        if: ${{ !cancelled() && hashFiles('reel.mp4') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nellore-reel-${{ github.run_id }}-${{ github.run_attempt }}
          path: reel.mp4
          retention-days: 5
