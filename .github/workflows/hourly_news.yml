name: Nellore Daily 30-Min News Reel Bot

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Preview mode only (download reel.mp4 in Artifacts without posting)'
        required: true
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg and Telugu Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run News Reel Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PREVIEW_ONLY: ${{ github.event.inputs.preview_only || 'false' }}
        run: python main.py

      - name: Upload Reel Artifact (Always Available to Download & Inspect)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nellore-daily-reel-${{ github.run_number }}
          path: reel.mp4
          if-no-files-found: ignore
          retention-days: 3

      - name: Save posted news history
        if: success()
        run: |
          git config user.name "Nellore Daily Bot"
          git config user.email "bot@nelloredaily.local"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted news history"
          git pull --rebase origin main || true
          git push
