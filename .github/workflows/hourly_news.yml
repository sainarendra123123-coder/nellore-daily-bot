name: Nellore Daily News Reel Bot

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      preview_only:
        description: 'Generate video artifact only without posting to IG/FB'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg + Telugu Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-extra fonts-dejavu-core

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install feedparser requests edge-tts pillow google-genai

      - name: Run News Reel Bot
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          PREVIEW_ONLY: ${{ github.event.inputs.preview_only || 'false' }}
        run: python main.py

      - name: Upload Reel Video Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nellore-daily-reel-${{ github.run_number }}
          path: reel.mp4
          retention-days: 5

      - name: Save posted news history
        if: success() && github.event.inputs.preview_only != 'true'
        run: |
          git config user.name "nellore-daily-bot"
          git config user.email "bot@nelloredaily.local"
          git add posted_history.json
          git diff --staged --quiet || git commit -m "chore: record posted news [skip ci]"
          git push
