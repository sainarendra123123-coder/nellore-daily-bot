name: Nellore editorial reel preview
on:
  push:
    branches: [nellore-daily-editorial-preview]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core
          pip install pillow edge-tts gTTS
      - name: Render and validate the Telugu reel
        run: |
          mkdir -p output
          cat > make.py <<'PY'
          import asyncio, json, math, subprocess as sp
          from concurrent.futures import ThreadPoolExecutor
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont
          from gtts import gTTS
          import edge_tts

          scenes = [
            ('పోలీస్ గ్రౌండ్', 'నెల్లూరులో కొత్త\nకమాండ్ సెంటర్', [
              'నెల్లూరు పోలీస్ గ్రౌండ్‌లో కొత్త కమాండ్ సెంటర్ ప్రారంభమైంది.',
              'నవంబర్ ఇరవై నాలుగున డీజీపీ హరీశ్ కుమార్ గుప్తా దీన్ని ప్రారంభించారు.']),
            ('ఒకే వేదికపై', 'సీసీ కెమెరాలు\nడ్రోన్లు', [
              'జిల్లాలోని సీసీ కెమెరాలు, డ్రోన్ల సమాచారాన్ని ఒకే చోట చూసేలా ఈ కేంద్రాన్ని ఏర్పాటు చేశారు.',
              'అత్యవసర సేవల సమన్వయానికీ ఇది ఉపయోగపడుతుంది.']),
            ('చిన్నబజార్', 'కొత్త పోలీస్\nస్టేషన్ భవనం', [
              'అదే పర్యటనలో చిన్నబజార్‌లో కొత్త పోలీస్ స్టేషన్ భవనాన్ని కూడా డీజీపీ ప్రారంభించారు.']),
          ]
          out = Path('output')
          teal, white, navy = '#66ebd4', '#f3f8ff', '#0b1827'
          face = '/usr/share/fonts/truetype/noto/NotoSansTelugu-Regular.ttf'
          def font(s):
              return ImageFont.truetype(face, s, layout_engine=ImageFont.Layout.RAQM)
          def draw_text(d, x, y, text, size, color):
              f = font(size)
              box = d.multiline_textbbox((0, 0), text, font=f, spacing=12)
              assert box[2]-box[0] <= 905, (text, box)
              d.multiline_text((x-box[0], y-box[1]), text, font=f, fill=color, spacing=12)
          def wrap(d, text, size):
              f, lines = font(size), ['']
              for word in text.split():
                  line = (lines[-1] + ' ' + word).strip()
                  if d.textlength(line, font=f) > 820 and lines[-1]:
                      lines.append(word)
                  else:
                      lines[-1] = line
              assert len(lines) <= 3, lines
              return '\n'.join(lines)
          def card(scene, label, title, caption, path):
              im = Image.new('RGB', (1080, 1920), navy)
              d = ImageDraw.Draw(im)
              for y in range(0, 1920, 6):
                  t = y / 1920
                  d.rectangle((0, y, 1080, y+6), fill=(11+int(5*t),24+int(16*t),39+int(17*t)))
              d.rounded_rectangle((90, 145, 153, 208), 16, fill=teal)
              d.polygon([(107,191),(107,162),(115,162),(133,180),(133,162),(141,162),(141,192),(133,192),(115,174),(115,191)], fill=navy)
              draw_text(d, 174, 156, 'NELLORE DAILY', 45, white)
              draw_text(d, 92, 264, '24 నవంబర్ 2026  /  నెల్లూరు', 37, '#a5c4d1')
              d.line((92, 340, 988, 340), fill='#306071', width=3)
              draw_text(d, 92, 402, label, 52, teal)
              draw_text(d, 92, 499, title, 96, white)
              d.rounded_rectangle((92, 825, 988, 1240), 42, fill='#102b3d', outline='#376679', width=4)
              for x in range(120, 960, 37):
                  for y in range(860, 1215, 37):
                      d.ellipse((x, y, x+3, y+3), fill='#315262')
              if scene == 0:
                  for x, y in [(305, 970), (537, 938), (769, 970)]:
                      d.rounded_rectangle((x-90,y-42,x+90,y+74), 13, fill='#163f54', outline=teal, width=6)
                      d.line((x-50,y+28,x-24,y+6,x+9,y+28,x+48,y-16), fill=teal,width=6)
                      d.line((x,y+74,x,y+105), fill=teal,width=7)
                  d.line((235,1084,839,1084),fill=teal,width=8)
              elif scene == 1:
                  for x in (330, 750):
                      d.ellipse((x-110,910,x+110,1130),outline='#43899a',width=4)
                  d.rounded_rectangle((266,980,365,1052),12,fill=teal)
                  d.polygon([(366,997),(401,978),(401,1051),(366,1034)],fill=teal)
                  d.line((700,1003,800,1053),fill=teal,width=12)
                  d.line((700,1053,800,1003),fill=teal,width=12)
                  for x in (695,805):
                      for y in (996,1060):
                          d.ellipse((x-17,y-10,x+17,y+10),fill=teal)
                  d.line((451,1020,629,1020),fill='#43899a',width=5)
              else:
                  d.polygon([(331,991),(540,879),(749,991)],fill='#26596e',outline=teal,width=6)
                  d.rectangle((358,992,722,1131),fill='#183c51',outline=teal,width=6)
                  for x in (407, 650):
                      d.rectangle((x-26,1025,x+26,1069),fill=teal)
                  d.rectangle((502,1025,578,1131),fill='#27566a',outline=teal,width=5)
              d.rounded_rectangle((92, 1304, 988, 1573), 29, fill='#06101c')
              draw_text(d, 130, 1350, wrap(d, caption, 53), 53, white)
              draw_text(d, 93, 1630, 'మూలాలు  /  The Hindu · పున్నమి', 34, '#a5c4d1')
              for i in range(3):
                  d.rounded_rectangle((92+i*114,1701,194+i*114,1712),5,fill=teal if i <= scene else '#36586a')
              im.save(path,quality=94)

          def run(*args):
              return sp.run(args,check=True,stdout=sp.PIPE,text=True).stdout
          def stamp(seconds):
              ms = round(seconds*1000)
              return f'00:{ms//60000:02}:{ms//1000%60:02},{ms%1000:03}'
          lines = [(j,label,title,line) for j,(label,title,parts) in enumerate(scenes) for line in parts]
          def synth(pair):
              n, (_,_,_,line) = pair
              try:
                  asyncio.run(asyncio.wait_for(edge_tts.Communicate(line,'te-IN-ShrutiNeural',rate='-3%').save(f'a{n}.mp3'),20))
                  print('Voice', n, 'ShrutiNeural', flush=True)
              except Exception:
                  gTTS(line, lang='te', timeout=12).save(f'a{n}.mp3')
                  print('Voice', n, 'Google Telugu', flush=True)
          with ThreadPoolExecutor(max_workers=5) as pool:
              list(pool.map(synth,enumerate(lines)))
          duration, cues, clips = 0, [], []
          for n,(scene,label,title,line) in enumerate(lines):
              card(scene,label,title,line,f'f{n}.jpg')
              if n in (0,2,4):
                  card(scene,label,title,line,out/f'frame-{scene+1}.jpg')
              seconds = float(run('ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0',f'a{n}.mp3'))
              assert 1 < seconds < 12
              frames = math.ceil((seconds+.24)*30)
              clip = f'v{n}.mp4'
              run('ffmpeg','-loglevel','error','-y','-i',f'f{n}.jpg','-i',f'a{n}.mp3',
                  '-vf',f"scale=2160:3840,zoompan=z='1+0.00007*on':x='iw/2-iw/zoom/2':y='ih/2-ih/zoom/2':d={frames}:s=1080x1920:fps=30,format=yuv420p",
                  '-af','loudnorm=I=-16:TP=-1.5:LRA=8,apad','-t',str(frames/30),
                  '-c:v','libx264','-preset','veryfast','-crf','18','-g','60',
                  '-c:a','aac','-ar','48000','-ac','2','-b:a','160k',clip)
              cues.append(f'{n+1}\n{stamp(duration)} --> {stamp(duration+frames/30)}\n{line}\n')
              clips.append(f"file '{clip}'")
              duration += frames/30
          Path('concat.txt').write_text('\n'.join(clips))
          (out/'nellore-command-centre.srt').write_text('\n'.join(cues))
          run('ffmpeg','-loglevel','error','-y','-f','concat','-safe','1','-i','concat.txt','-c','copy','-movflags','+faststart',str(out/'nellore-command-centre.mp4'))
          assert 15 < duration < 40, duration
          meta = json.loads(run('ffprobe','-v','error','-show_streams','-of','json',str(out/'nellore-command-centre.mp4')))['streams']
          assert (meta[0]['width'],meta[0]['height'],meta[0]['codec_name'],meta[1]['codec_name']) == (1080,1920,'h264','aac')
          run('ffmpeg','-v','error','-xerror','-i',str(out/'nellore-command-centre.mp4'),'-f','null','-')
          print(f'Validated 1080x1920 H.264/AAC, {duration:.1f} seconds, {len(cues)} subtitle cues; full decode passed.')
          PY
          python make.py
      - uses: actions/upload-artifact@v4
        with:
          name: nellore-command-centre
          path: output/
          if-no-files-found: error
